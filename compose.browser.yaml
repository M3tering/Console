# Browser engine override for central or standalone. ./auto-compose.sh adds it when
# .env has BROWSER_ENABLED=true, and prepares data ownership for the image's UID 1000.
services:
  console:
    image: ${BROWSER_IMAGE:-ghcr.io/fluxion9/console-browser:main}
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    # Docker's default seccomp profile plus clone/setns/unshare, which Chromium's
    # sandbox needs to create its namespaces. The container gains no capabilities.
    security_opt:
      - seccomp=./deploy/browser-seccomp.json
    environment:
      BROWSER_EXECUTABLE: /usr/bin/chromium
