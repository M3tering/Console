name: M3tering Console Test and Publish Docker Image

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: npm test

      - name: Install browser for desktop UI tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop themes and responsive interactions
        run: npm run test:ui

  build-platform:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        variant: [console, browser, updater]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Normalize image names
        run: |
          suffix=""
          if [[ "${{ matrix.variant }}" != console ]]; then suffix="-${{ matrix.variant }}"; fi
          echo "CONSOLE_IMAGE_NAME=${GITHUB_REPOSITORY,,}$suffix" >> "$GITHUB_ENV"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          # Package availability differs between the AMD64 and ARM64 runners.
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Console image - push by digest with repository name
      - name: Build Console image (single platform)
        id: build-console
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.CONSOLE_IMAGE_NAME }},push-by-digest=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CONSOLE_IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max', env.REGISTRY, env.CONSOLE_IMAGE_NAME, matrix.arch) || '' }}

      - name: Attest published platform image
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.CONSOLE_IMAGE_NAME }}
          subject-digest: ${{ steps.build-console.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Save digests to files
        if: github.event_name != 'pull_request'
        run: |
          echo ${{ steps.build-console.outputs.digest }} > digests-${{ matrix.arch }}-${{ matrix.variant }}-digest.txt

      - name: Upload digests artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            digests-${{ matrix.arch }}-${{ matrix.variant }}-digest.txt

  create-manifests:
    strategy:
      matrix:
        variant: [console, browser, updater]
    needs: build-platform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Normalize image names
        run: |
          suffix=""
          if [[ "${{ matrix.variant }}" != console ]]; then suffix="-${{ matrix.variant }}"; fi
          echo "CONSOLE_IMAGE_NAME=${GITHUB_REPOSITORY,,}$suffix" >> "$GITHUB_ENV"

      - name: Download all digests
        uses: actions/download-artifact@v7
        with:
          pattern: digests-*-${{ matrix.variant }}
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for Console image
        id: meta-console
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.CONSOLE_IMAGE_NAME }}

      - name: Create multi-arch manifest for Console
        id: manifest
        env:
          IMAGE_TAGS: ${{ steps.meta-console.outputs.tags }}
        run: |
          AMD64_DIGEST=$(cat digests-amd64-${{ matrix.variant }}-digest.txt)
          ARM64_DIGEST=$(cat digests-arm64-${{ matrix.variant }}-digest.txt)
          echo "AMD64_DIGEST=$AMD64_DIGEST"
          echo "ARM64_DIGEST=$ARM64_DIGEST"
          TAG_ARGS=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              TAG_ARGS+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create --metadata-file manifest.json "${TAG_ARGS[@]}" \
            "$REGISTRY/$CONSOLE_IMAGE_NAME@$AMD64_DIGEST" \
            "$REGISTRY/$CONSOLE_IMAGE_NAME@$ARM64_DIGEST"

          DIGEST=$(jq -r '."containerimage.descriptor".digest' manifest.json)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest published multi-architecture manifest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.CONSOLE_IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
