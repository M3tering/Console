services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
    image: m3tering-console:dev
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.data-dev:/opt/app/.data
      - console_dev_extension_sources:/opt/app/src/extensions
      - console_dev_extension_builds:/opt/app/dist/extensions

volumes:
  console_dev_extension_sources:
  console_dev_extension_builds:
