services:
  console:
    image: ghcr.io/m3tering/console:main
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./.data:/opt/app/.data
      - console_extension_sources:/opt/app/src/extensions
      - console_extension_builds:/opt/app/dist/extensions

volumes:
  console_db:
  console_extension_sources:
  console_extension_builds:
