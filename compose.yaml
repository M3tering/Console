services:
  console:
    image: ${CONSOLE_IMAGE:-ghcr.io/m3tering/console:main}
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.cjs"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 24
    env_file:
      - .env
    volumes:
      - ./.data:/opt/app/.data
      - console_extension_sources:/opt/app/src/extensions
      - console_extension_builds:/opt/app/dist/extensions

volumes:
  console_db:
  console_extension_sources:
  console_extension_builds:
