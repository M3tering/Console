# Started by ./auto-compose.sh on gateways when REMOTE_UPDATES_ENABLED=true. This service alone has Docker access.
# Image and signature trust follow the checkout's GitHub repository; auto-compose.sh sets them.
services:
  updater:
    image: ${UPDATER_IMAGE:?Run ./auto-compose.sh; it sets the updater image from the checkout's repository}
    restart: unless-stopped
    environment:
      REMOTE_UPDATES_ENABLED: ${REMOTE_UPDATES_ENABLED:-false}
      UPDATER_IMAGE_REPOSITORY: ${UPDATER_IMAGE_REPOSITORY:?Run ./auto-compose.sh; it sets the trusted image repository}
      UPDATER_SOURCE_REPOSITORY: ${UPDATER_SOURCE_REPOSITORY:?Run ./auto-compose.sh; it sets the trusted source repository}
      UPDATER_ALLOWED_REFS: ${UPDATER_ALLOWED_REFS:-refs/heads/main}
      UPDATER_PROJECT: ${COMPOSE_PROJECT_NAME:?Set the existing gateway Compose project name}
      UPDATER_DEPLOY_DIRECTORY: ${UPDATER_DEPLOY_DIRECTORY:?Set the absolute host checkout path}
      UPDATER_RECONNECT_TIMEOUT_MS: ${UPDATER_RECONNECT_TIMEOUT_MS:-180000}
      GH_TOKEN: ${UPDATER_GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path on host and container: Compose bind paths must resolve on the host.
      - ${UPDATER_DEPLOY_DIRECTORY}:${UPDATER_DEPLOY_DIRECTORY}:ro
      - ./.data/agent:/agent
      - ./.data/updater:/state
    read_only: true
    tmpfs: [/tmp, /root/.config]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
